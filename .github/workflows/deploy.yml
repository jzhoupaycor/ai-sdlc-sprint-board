name: Deploy — GitHub Pages

on:
  push:
    branches: [main]
  # Allow manual trigger from Actions tab
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  pull-requests: write

# Suppress Node.js 20 deprecation warnings — GitHub will enforce Node.js 24 on June 2, 2026
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# Only one deploy at a time;cancel in-progress if a new one starts
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # ── Job 1: Build ────────────────────────────────────────
  build:
    name: 🏗️ Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inject deploy metadata into app
        run: |
          COMMIT_SHA="${{ github.sha }}"
          SHORT_SHA="${COMMIT_SHA:0:7}"
          DEPLOY_TIME="$(date -u '+%Y-%m-%d %H:%M UTC')"
          ACTOR="${{ github.actor }}"

          # Inject a deploy banner into footer
          sed -i "s|Built with ❤️ by AI Agents|Built with ❤️ by AI Agents · Commit <code>${SHORT_SHA}</code> · Deployed ${DEPLOY_TIME} by @${ACTOR}|" index.html
          echo "✅ Injected deploy metadata: ${SHORT_SHA} @ ${DEPLOY_TIME}"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Upload entire repository root as the site
          path: '.'

  # ── Job 2: Deploy ───────────────────────────────────────
  deploy:
    name: 🚀 Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Print deployed URL
        run: |
          echo "## Deployed!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Live URL:** ${{ steps.deployment.outputs.page_url }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Detail | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Commit | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Branch | \`${{ github.ref_name }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Triggered by | @${{ github.actor }} |" >> $GITHUB_STEP_SUMMARY
          echo "| PR approved by | _(human reviewer)_ |" >> $GITHUB_STEP_SUMMARY

      # Post deploy URL to the PR that triggered this deploy (if any)
      - name: Comment deploy URL on merged PR
        uses: actions/github-script@v7
        with:
          script: |
            // Find the most recently merged PR into main
            const { data: prs } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'closed',
              base: 'main',
              per_page: 1,
              sort: 'updated',
              direction: 'desc',
            });
            if (!prs.length || !prs[0].merged_at) {
              console.log('No recently merged PR found — skipping comment.');
              return;
            }
            const pr = prs[0];
            const pageUrl = '${{ steps.deployment.outputs.page_url }}';
            const sha     = '${{ github.sha }}'.slice(0, 7);
            const actor   = '${{ github.actor }}';
            const body = [
              '### Deployed to GitHub Pages',
              '',
              `**Live URL:** ${pageUrl}`,
              '',
              '| Detail | Value |',
              '|--------|-------|',
              `| Commit | \`${sha}\` |`,
              `| Deployed by | @${actor} |`,
              '| Status | Live |',
              '',
              '_Auto-deployed by GitHub Actions after merge._',
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number,
              body,
            });
            console.log(`Posted deploy URL to PR #${pr.number}`);
