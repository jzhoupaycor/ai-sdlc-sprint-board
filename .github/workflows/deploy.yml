name: Deploy — GitHub Pages

on:
  push:
    branches: [main]
  # Allow manual trigger from Actions tab
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deploy at a time; cancel in-progress if a new one starts
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # ── Job 1: Build ────────────────────────────────────────
  build:
    name: 🏗️ Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inject deploy metadata into app
        run: |
          COMMIT_SHA="${{ github.sha }}"
          SHORT_SHA="${COMMIT_SHA:0:7}"
          DEPLOY_TIME="$(date -u '+%Y-%m-%d %H:%M UTC')"
          ACTOR="${{ github.actor }}"

          # Inject a deploy banner into footer
          sed -i "s|Built with ❤️ by AI Agents|Built with ❤️ by AI Agents · Commit <code>${SHORT_SHA}</code> · Deployed ${DEPLOY_TIME} by @${ACTOR}|" index.html
          echo "✅ Injected deploy metadata: ${SHORT_SHA} @ ${DEPLOY_TIME}"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Upload entire repository root as the site
          path: '.'

  # ── Job 2: Deploy ───────────────────────────────────────
  deploy:
    name: 🚀 Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Print deployed URL
        run: |
          echo "## Deployed!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Live URL:** ${{ steps.deployment.outputs.page_url }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Detail | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Commit | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Branch | \`${{ github.ref_name }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Triggered by | @${{ github.actor }} |" >> $GITHUB_STEP_SUMMARY
          echo "| PR approved by | _(human reviewer)_ |" >> $GITHUB_STEP_SUMMARY

      # Post deploy URL to the PR that triggered this deploy (if any)
      - name: Comment deploy URL on merged PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          PAGE_URL="${{ steps.deployment.outputs.page_url }}"
          SHORT_SHA="${{ github.sha }}"
          SHORT_SHA="${SHORT_SHA:0:7}"

          # Find the PR that was merged into this push (if any)
          PR_NUM=$(gh pr list --state merged --base main --limit 1 --json number --jq '.[0].number' 2>/dev/null || echo "")

          if [ -n "$PR_NUM" ]; then
            gh pr comment "$PR_NUM" --body "### Deployed to GitHub Pages

**Live URL:** ${PAGE_URL}

| Detail | Value |
|--------|-------|
| Commit | \`${SHORT_SHA}\` |
| Deployed by | @${{ github.actor }} |
| Status | Live |

_Auto-deployed by GitHub Actions after merge._"
            echo "Posted deploy URL to PR #${PR_NUM}"
          else
            echo "No PR found to comment on — deploy complete anyway."
          fi
